<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Statistics Survivor</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    color:#002E5D;
}

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:20px;
}

.page-header h1{
    margin:0;
}

.active-game-code{
    display:inline-block;
    margin-left:.5em;
    color:#555;
    font-size:.75em;
    font-weight:normal;
    overflow-wrap:anywhere;
}

.gear-button{
    display:grid;
    flex:0 0 48px;
    width:48px;
    height:48px;
    place-items:center;
    padding:0;
    margin:0;
    background:#002E5D;
    color:white;
    font-size:26px;
    line-height:1;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

dialog{
    box-sizing:border-box;
    width:min(520px,calc(100% - 32px));
    padding:24px;
    border:0;
    border-radius:10px;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

dialog::backdrop{
    background:rgba(0,0,0,.55);
}

.dialog-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.dialog-header h2{
    margin:0;
}

.dialog-close-button{
    width:40px;
    height:40px;
    padding:0;
    margin:0;
    border:1px solid #777;
    border-radius:2px;
    background:#f0f0f0;
    color:#111;
    font-size:24px;
}

.dialog-close-button:hover{
    background:#e5e5e5;
}

.join-button{
    border:0;
    border-radius:5px;
    background:#00B140;
    color:white;
}

.join-button:hover{
    background:#009d39;
}

input{
    box-sizing:border-box;
    width:100%;
    max-width:100%;
    padding:10px;
    margin:8px 0;
    font-size:16px;
}

button{
    border:0;
    border-radius:5px;
    padding:12px 20px;
    margin:5px;
    cursor:pointer;
    font-size:16px;
}

button:disabled{
    cursor:not-allowed;
    opacity:.6;
}

button:focus-visible{
    outline:3px solid #00B140;
    outline-offset:2px;
}

.score-display{
    display:flex;
    align-items:stretch;
    gap:12px;
    max-width:432px;
    margin:1em 0;
}

.current-score{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex:1;
    max-width:320px;
    margin:0;
    padding:16px 20px;
    border-radius:8px;
    background:#002E5D;
    color:white;
    font-weight:bold;
}

.current-score span{
    font-size:1.8rem;
}

.score-change{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0;
    padding:16px 18px;
    border-radius:8px;
    color:white;
    font-size:1.5rem;
    font-weight:bold;
    white-space:nowrap;
}

.score-change.hidden{
    display:none;
}

.score-change[data-change="increase"]{
    background:#00B140;
}

.score-change[data-change="decrease"]{
    background:#c62828;
}

.reward-progress{
    display:flex;
    justify-content:center;
    width:100%;
    max-width:100%;
    padding:0;
    margin:16px auto 20px;
}

.reward-dial{
    --reward-success-angle:0deg;
    --reward-roll-angle:210deg;
    position:relative;
    flex:0 0 160px;
    width:160px;
    height:160px;
    border-radius:50%;
}

.reward-dial::before{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(
        from 210deg,
        #00B140 0deg var(--reward-success-angle),
        #d8dce2 var(--reward-success-angle) 300deg,
        transparent 300deg 360deg
    );
    content:"";
}

.reward-dial-face{
    position:relative;
    display:grid;
    z-index:1;
    width:132px;
    height:132px;
    margin:14px;
    place-items:center;
    border-radius:50%;
    background:white;
}

.reward-scale-marker{
    position:absolute;
    z-index:3;
    top:calc(50% - 8px);
    left:calc(50% - 2px);
    width:4px;
    height:16px;
    border-radius:2px;
    background:#000;
}

.reward-scale-marker-0{
    transform:rotate(210deg) translateY(-73px);
}

.reward-scale-marker-15{
    transform:rotate(255deg) translateY(-73px);
}

.reward-scale-marker-60{
    transform:rotate(390deg) translateY(-73px);
}

.reward-scale-marker-100{
    transform:rotate(510deg) translateY(-73px);
}

.reward-scale-value{
    position:absolute;
    z-index:4;
    color:#000;
    font-size:.62rem;
    font-weight:bold;
    transform:translate(-50%,-50%);
}

.reward-scale-value-0{
    top:113px;
    left:39px;
}

.reward-scale-value-15{
    top:80px;
    left:20px;
    padding:1px 3px;
    border-radius:2px;
    background:white;
}

.reward-scale-value-60{
    top:19px;
    left:93px;
}

.reward-scale-value-100{
    top:113px;
    left:93px;
}

.reward-needle{
    position:absolute;
    z-index:5;
    top:calc(50% - 64px);
    left:calc(50% - 2px);
    display:none;
    width:4px;
    height:64px;
    border-radius:4px;
    background:#002E5D;
    transform:rotate(var(--reward-roll-angle));
    transform-origin:50% 100%;
    transition:transform 1.8s cubic-bezier(.2,.7,.2,1);
}

.reward-dial.has-needle .reward-needle{
    display:block;
}

.reward-dial-hub{
    position:absolute;
    z-index:6;
    top:calc(50% - 7px);
    left:calc(50% - 7px);
    width:14px;
    height:14px;
    border:2px solid white;
    border-radius:50%;
    background:#002E5D;
}

.reward-dial-readout{
    position:absolute;
    z-index:7;
    bottom:28px;
    left:50%;
    display:flex;
    justify-content:center;
    transform:translateX(-50%);
}

.reward-dial-readout-value{
    color:#002E5D;
    font-size:1.2rem;
    font-weight:bold;
    white-space:nowrap;
}

.reward-dial-readout-value[data-outcome="rewarded"]{
    color:#008c33;
}

.reward-dial-readout-value[data-outcome="missed"],
.reward-dial-readout-value[data-outcome="error"]{
    color:#C62828;
}

.confetti-layer{
    position:fixed;
    inset:0;
    z-index:1000;
    overflow:hidden;
    pointer-events:none;
}

.confetti-piece{
    position:absolute;
    top:-14px;
    width:9px;
    height:14px;
    animation:confetti-fall 2.8s linear forwards;
}

@keyframes confetti-fall{
    from{
        opacity:1;
        transform:translate3d(0,-14px,0) rotate(0deg);
    }

    to{
        opacity:0;
        transform:translate3d(var(--drift),105vh,0) rotate(var(--rotation));
    }
}

.vote{
    display:block;
    position:relative;
    width:100%;
    min-height:76px;
    padding:16px 60px 16px 20px;
    border-radius:8px;
    background:#00B140;
    color:white;
    text-align:left;
}

.vote:not(:disabled):hover{
    background:#009d39;
}

.vote:disabled{
    cursor:not-allowed;
    opacity:.6;
}

.vote-indicator{
    position:absolute;
    top:50%;
    right:16px;
    transform:translateY(-50%);
    color:white;
    font-size:2.5rem;
    line-height:1;
    font-weight:bold;
}

.hidden{
    display:none;
}

.success{
    color:green;
    font-weight:bold;
}

.round-result{
    margin-bottom:10px;
    padding:12px;
    border-radius:6px;
    background:#f2f2f2;
}

@media(max-width:600px){
    body{
        padding:14px;
    }

    .card{
        padding:16px;
    }

    .page-header{
        align-items:flex-start;
    }

    .page-header h1{
        font-size:1.6rem;
    }

    .score-display{
        max-width:none;
    }

    .current-score{
        max-width:none;
    }

}

@media(prefers-reduced-motion: reduce){
    .reward-needle{
        transition:none;
    }

    .confetti-piece{
        animation:none;
    }
}

</style>

</head>

<body>

<header class="page-header">
    <h1>Statistics Survivor<span id="activeGameCode"
                                 class="active-game-code"></span></h1>
    <button id="openJoinDialogBtn"
            class="gear-button"
            type="button"
            aria-label="Join a game"
            aria-haspopup="dialog"
            aria-controls="joinDialog"
            title="Join a game">⚙</button>
</header>

<div id="confettiLayer"
     class="confetti-layer"
     aria-hidden="true"></div>

<dialog id="joinDialog"
        aria-labelledby="joinDialogTitle">

    <div class="dialog-header">
        <h2 id="joinDialogTitle">Join Game</h2>
        <button id="closeJoinDialogBtn"
                class="dialog-close-button"
                type="button"
                aria-label="Close dialog"
                title="Close dialog">×</button>
    </div>

    <label for="gameCode">Game Code</label>

    <input id="gameCode">

    <label for="teamName">Team Name</label>

    <input id="teamName"
           maxlength="80">

    <p id="joinStatus"
       class="hidden"
       role="status"></p>

    <button id="joinBtn"
            class="join-button"
            type="button">
        Join Game
    </button>

</dialog>

<div id="gameCard"
     class="card hidden">

    <h2 id="teamTitle"></h2>

    <div class="score-display">
        <p class="current-score">
            Current Score:
            <span id="score">100</span>
        </p>
        <p id="scoreChange"
           class="score-change hidden"
           aria-live="polite"
           aria-atomic="true"></p>
    </div>

    <section class="reward-progress"
             aria-label="Reward chance speedometer">
        <div id="rewardDial"
             class="reward-dial"
             role="img"
             aria-label="Choose an expedition to see the reward chance and roll">
            <div class="reward-dial-face">
                 <span class="reward-scale-marker reward-scale-marker-0"
                       aria-hidden="true"></span>
                 <span class="reward-scale-marker reward-scale-marker-15"
                       aria-hidden="true"></span>
                 <span class="reward-scale-marker reward-scale-marker-60"
                       aria-hidden="true"></span>
                 <span class="reward-scale-marker reward-scale-marker-100"
                       aria-hidden="true"></span>
                 <span class="reward-scale-value reward-scale-value-0"
                       aria-hidden="true">0%</span>
                 <span class="reward-scale-value reward-scale-value-15"
                       aria-hidden="true">15%</span>
                 <span class="reward-scale-value reward-scale-value-60"
                       aria-hidden="true">60%</span>
                 <span class="reward-scale-value reward-scale-value-100"
                       aria-hidden="true">100%</span>
                <span id="rewardNeedle"
                      class="reward-needle"
                      aria-hidden="true"></span>
                <span class="reward-dial-hub"
                      aria-hidden="true"></span>
                <div class="reward-dial-readout"
                     aria-hidden="true">
                    <strong id="rewardRollValue"
                            class="reward-dial-readout-value">—</strong>
                </div>
            </div>
        </div>
    </section>

    <h3>Choose Expedition</h3>

    <button class="vote"
            data-choice="Safe">

        SAFE EXPEDITION<br>
        Guaranteed +8
        <span class="vote-indicator hidden"
              role="img"
              aria-label="Vote submitted">✓</span>
    </button>

    <button class="vote"
            data-choice="Explorer">

        EXPLORER EXPEDITION<br>
        60% +18, 40% -8
        <span class="vote-indicator hidden"
              role="img"
              aria-label="Vote submitted">✓</span>
    </button>

    <button class="vote"
            data-choice="Treasure">

        TREASURE EXPEDITION<br>
        15% +60, 85% -12
        <span class="vote-indicator hidden"
              role="img"
              aria-label="Vote submitted">✓</span>
    </button>

    <p id="voteStatus"></p>

    <h3>Logged Round Results</h3>

    <div id="roundResults">
        No round results logged yet.
    </div>

</div>

<script type="module">

import { db }
from "./firebase.js";

import {
    collection,
    doc,
    updateDoc,
    getDoc,
    getDocs,
    onSnapshot,
    query,
    runTransaction,
    where
}
from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

let teamId = null;
let gameCode = null;
let currentRound = null;
let votingOpen = false;
let voteLoaded = false;
let votedChoice = null;
let submittingVote = false;
let latestTeamResult = null;
let currentTeamScore = null;
let pendingScoreIncreaseConfetti = false;
let confettiFallbackReady = false;
let confettiFallbackTimer = null;
let rewardNeedleAnimating = false;
let rewardNeedleAnimationTimer = null;
let confettiTimeout = null;
let unsubscribeScore = null;
let unsubscribeGame = null;
let unsubscribeVote = null;
let unsubscribeLegacyVote = null;
let unsubscribeResults = null;

const REWARD_CHANCES = {
    Safe:1,
    Explorer:0.6,
    Treasure:0.15
};

const voteButtons =
document.querySelectorAll(".vote");
const joinDialog =
document.getElementById("joinDialog");
const openJoinDialogButton =
document.getElementById("openJoinDialogBtn");
const gameCodeInput =
document.getElementById("gameCode");
const teamNameInput =
document.getElementById("teamName");
const joinStatus =
document.getElementById("joinStatus");
const rewardNeedleElement =
document.getElementById("rewardNeedle");

const REWARD_NEEDLE_TRANSITION_MS = 1800;

rewardNeedleElement.addEventListener(
    "transitionend",
    event=>{
        if(event.target === rewardNeedleElement &&
           event.propertyName === "transform")
            finishRewardNeedleAnimation();
    }
);

function getVoteRoundIds(round){

    const paddedRoundId =
        `round${String(round).padStart(2, "0")}`;
    const legacyRoundId = `round${round}`;

    return paddedRoundId === legacyRoundId
        ? [paddedRoundId]
        : [paddedRoundId, legacyRoundId];
}

const savedTeam =
localStorage.getItem("survivorTeamId");

const savedGame =
localStorage.getItem("survivorGameCode");

if(savedTeam && savedGame){

    teamId = savedTeam;
    gameCode = savedGame;

    loadExistingTeam();
}

document
.getElementById("joinBtn")
.addEventListener(
"click",
joinGame
);

document
.getElementById("openJoinDialogBtn")
.addEventListener("click", openJoinDialog);

document
.getElementById("closeJoinDialogBtn")
.addEventListener("click", ()=>joinDialog.close());

async function joinGame(){

    const requestedGameCode =
        gameCodeInput.value.trim();

    if(!requestedGameCode || requestedGameCode.includes("/")){

        alert(
        "Enter a valid game code"
        );

        return;
    }

    const teamName =
        teamNameInput.value.trim();

    if(!teamName){

        alert(
        "Enter a team name"
        );

        return;
    }

    const gameSnap =
    await getDoc(
        doc(
            db,
            "games",
            requestedGameCode
        )
    );

    if(!gameSnap.exists()){

        alert(
        "Game not found. Check the game code."
        );

        return;
    }

    const normalizedName =
        teamName.normalize("NFKC").toLowerCase();
    const encodedName =
        encodeURIComponent(normalizedName);

    if(encodedName.length > 1400){
        alert("That team name is too long.");
        return;
    }

    const teamsCollection =
    collection(
        db,
        "games",
        requestedGameCode,
        "teams"
    );

    const existingTeams =
    await getDocs(teamsCollection);

    const nameAlreadyTaken =
    existingTeams.docs.some(teamDoc=>
        (teamDoc.data().normalizedName ??
            teamDoc.data().name?.trim().normalize("NFKC").toLowerCase()) ===
        normalizedName
    );

    if(nameAlreadyTaken){
        alert("That team name is already taken in this game. Choose another name.");
        return;
    }

    const teamRef = doc(teamsCollection);
    const teamNameRef =
    doc(
        db,
        "games",
        requestedGameCode,
        "teamNames",
        encodedName
    );

    let teamCreated;

    try{
        teamCreated =
        await runTransaction(
            db,
            async transaction=>{

                const nameSnap =
                await transaction.get(teamNameRef);

                if(nameSnap.exists())
                    return false;

                transaction.set(
                    teamNameRef,
                    {
                        teamId:teamRef.id,
                        name:teamName
                    }
                );

                transaction.set(
                    teamRef,
                    {
                        name:teamName,
                        normalizedName,
                        score:100
                    }
                );

                return true;
            }
        );
    }catch(error){
        alert(`Unable to join game: ${error.message}`);
        return;
    }

    if(!teamCreated){
        alert("That team name is already taken in this game. Choose another name.");
        return;
    }

    stopCurrentGameListeners();
    teamId =
    teamRef.id;
    gameCode =
    requestedGameCode;

    localStorage.setItem(
        "survivorTeamId",
        teamId
    );

    localStorage.setItem(
        "survivorGameCode",
        gameCode
    );

    showGame(teamName);

    listenForScore();
    listenForVoting();
    listenForRoundResults();
    joinStatus.textContent = "";
    joinStatus.classList.add("hidden");
    joinDialog.close();
}

async function loadExistingTeam(){

    const teamRef =
    doc(
        db,
        "games",
        gameCode,
        "teams",
        teamId
    );

    const snap =
    await getDoc(
        teamRef
    );

    if(!snap.exists()){

        handleTeamRemoved();
        return;
    }

    showGame(
        snap.data().name
    );

    listenForScore();
    listenForVoting();
    listenForRoundResults();
}

function showGame(name){

    document.getElementById("activeGameCode").textContent =
        gameCode ? `· Game: ${gameCode}` : "";

    document
    .getElementById("gameCard")
    .classList
    .remove("hidden");

    document
    .getElementById("teamTitle")
    .innerText =
    name;
}

function openJoinDialog(){

    joinStatus.textContent = "";
    joinStatus.classList.add("hidden");

    if(teamId){
        gameCodeInput.value = gameCode;
        teamNameInput.value =
            document.getElementById("teamTitle").textContent;
    }

    joinDialog.showModal();
    gameCodeInput.focus();
}

function listenForScore(){

    let previousScore = null;

    unsubscribeScore =
    onSnapshot(

        doc(
            db,
            "games",
            gameCode,
            "teams",
            teamId
        ),

        snap=>{

            if(!snap.exists()){
                handleTeamRemoved();
                return;
            }

            const score = snap.data().score;
            currentTeamScore =
                typeof score === "number" ? score : null;
            const scoreElement =
                document.getElementById("score");
            const scoreChange =
                typeof previousScore === "number" &&
                typeof score === "number"
                    ? score - previousScore
                    : null;

            scoreElement.textContent = score;
            renderScoreChange(scoreChange);

            if(scoreChange > 0)
                queueScoreIncreaseConfetti();

            previousScore =
                typeof score === "number" ? score : null;

        }

    );
}

function renderScoreChange(change){

    const scoreChangeElement =
        document.getElementById("scoreChange");
    const persistedChange =
        latestTeamResult &&
        currentTeamScore !== null &&
        Number.isFinite(latestTeamResult.delta) &&
        latestTeamResult.delta !== 0
            ? latestTeamResult.delta
            : null;
    const visibleChange =
        Number.isFinite(change) && change !== 0
            ? change
            : persistedChange;

    if(visibleChange === null){
        scoreChangeElement.textContent = "";
        scoreChangeElement.classList.add("hidden");
        delete scoreChangeElement.dataset.change;
        return;
    }

    scoreChangeElement.textContent =
        `${visibleChange > 0 ? "+" : ""}${visibleChange}`;
    scoreChangeElement.dataset.change =
        visibleChange > 0 ? "increase" : "decrease";
    scoreChangeElement.classList.remove("hidden");
}

function showConfetti(){

    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)
        return;

    const confettiLayer =
        document.getElementById("confettiLayer");
    const colors = ["#00B140", "#FFD700", "#FF6B6B", "#4D96FF", "#B967FF"];
    const pieces = document.createDocumentFragment();

    if(confettiTimeout !== null)
        window.clearTimeout(confettiTimeout);

    confettiLayer.replaceChildren();

    for(let i = 0; i < 60; i++){
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = `${Math.random() * 0.25}s`;
        piece.style.setProperty(
            "--drift",
            `${Math.random() * 240 - 120}px`
        );
        piece.style.setProperty(
            "--rotation",
            `${Math.random() * 1080 - 540}deg`
        );
        pieces.append(piece);
    }

    confettiLayer.append(pieces);
    confettiTimeout =
        window.setTimeout(()=>{
            confettiLayer.replaceChildren();
            confettiTimeout = null;
        }, 3600);
}

function maybeShowPendingConfetti(){

    if(!pendingScoreIncreaseConfetti ||
       rewardNeedleAnimating)
        return;

    const resultMatchesScore =
        latestTeamResult &&
        currentTeamScore !== null &&
        latestTeamResult.score === currentTeamScore;

    if(!resultMatchesScore && !confettiFallbackReady)
        return;

    pendingScoreIncreaseConfetti = false;
    confettiFallbackReady = false;

    if(confettiFallbackTimer !== null){
        window.clearTimeout(confettiFallbackTimer);
        confettiFallbackTimer = null;
    }

    showConfetti();
}

function queueScoreIncreaseConfetti(){

    pendingScoreIncreaseConfetti = true;
    confettiFallbackReady = false;

    if(confettiFallbackTimer !== null)
        window.clearTimeout(confettiFallbackTimer);

    confettiFallbackTimer =
        window.setTimeout(()=>{
            confettiFallbackTimer = null;
            confettiFallbackReady = true;
            maybeShowPendingConfetti();
        }, REWARD_NEEDLE_TRANSITION_MS + 500);

    maybeShowPendingConfetti();
}

function finishRewardNeedleAnimation(){

    if(rewardNeedleAnimationTimer !== null){
        window.clearTimeout(rewardNeedleAnimationTimer);
        rewardNeedleAnimationTimer = null;
    }

    rewardNeedleAnimating = false;
    maybeShowPendingConfetti();
}

function hideRewardNeedle(){

    const dial = document.getElementById("rewardDial");

    dial.classList.remove("has-needle");
    dial.style.setProperty("--reward-roll-angle", "210deg");

    if(rewardNeedleAnimationTimer !== null){
        window.clearTimeout(rewardNeedleAnimationTimer);
        rewardNeedleAnimationTimer = null;
    }

    rewardNeedleAnimating = false;
    maybeShowPendingConfetti();
}

function setRewardNeedlePosition(roll){

    const dial = document.getElementById("rewardDial");
    const targetAngle = `${210 + roll * 300}deg`;

    if(!dial.classList.contains("has-needle")){
        dial.style.setProperty("--reward-roll-angle", "210deg");
        dial.classList.add("has-needle");
        rewardNeedleElement.getBoundingClientRect();
    }

    if(dial.style.getPropertyValue("--reward-roll-angle") === targetAngle){
        maybeShowPendingConfetti();
        return;
    }

    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
        dial.style.setProperty("--reward-roll-angle", targetAngle);
        finishRewardNeedleAnimation();
        return;
    }

    rewardNeedleAnimating = true;

    if(rewardNeedleAnimationTimer !== null)
        window.clearTimeout(rewardNeedleAnimationTimer);

    rewardNeedleAnimationTimer =
        window.setTimeout(
            finishRewardNeedleAnimation,
            REWARD_NEEDLE_TRANSITION_MS + 250
        );

    dial.style.setProperty("--reward-roll-angle", targetAngle);
}

function renderRewardDial(choice, result = null){

    const dial = document.getElementById("rewardDial");
    const rollValue =
        document.getElementById("rewardRollValue");

    if(!Object.prototype.hasOwnProperty.call(REWARD_CHANCES, choice)){
        dial.classList.remove("has-choice");
        rollValue.removeAttribute("data-outcome");
        dial.style.setProperty("--reward-success-angle", "0deg");
        hideRewardNeedle();
        dial.setAttribute(
            "aria-label",
            "Choose an expedition to see reward chance and random roll. " +
            "The scale marks 0%, 15%, 60%, and 100%."
        );
        rollValue.textContent = "—";
        return;
    }

    const chance =
        Number.isFinite(result?.rewardChance) &&
        result.rewardChance >= 0 &&
        result.rewardChance <= 1
            ? result.rewardChance
            : REWARD_CHANCES[choice];
    const chancePercent = Math.round(chance * 100);

    dial.classList.add("has-choice");
    dial.style.setProperty(
        "--reward-success-angle",
        `${chance * 300}deg`
    );
    rollValue.removeAttribute("data-outcome");

    if(choice === "Safe"){
        const hasRecordedSafeRoll =
            Number.isFinite(result?.roll) &&
            result.roll >= 0 &&
            result.roll < 1;

        const safePointerPercent = hasRecordedSafeRoll
            ? Math.round(result.roll * 100)
            : 0;
        rollValue.textContent = `${safePointerPercent}%`;
        rollValue.dataset.outcome = "rewarded";
        setRewardNeedlePosition(
            hasRecordedSafeRoll ? result.roll : 0
        );
        const rollDescription =
            hasRecordedSafeRoll
                ? `random roll ${result.roll}`
                : "random roll pending at 0%";
        dial.setAttribute(
            "aria-label",
            `Safe expedition: guaranteed 100% reward chance; ` +
            `${rollDescription}. ` +
            "Scale marks 0%, 15%, 60%, and 100%."
        );
        return;
    }

    const hasRecordedRoll =
        Number.isFinite(result?.roll) &&
        result.roll >= 0 &&
        result.roll < 1;

    if(hasRecordedRoll){
        rollValue.textContent =
            `${Math.round(result.roll * 100)}%`;
        rollValue.dataset.outcome =
            result.delta > 0 ? "rewarded" : "missed";
        setRewardNeedlePosition(result.roll);

        const outcome =
            result.delta > 0
                ? `rewarded +${result.delta} points`
                : `punished ${result.delta} points`;
        dial.setAttribute(
            "aria-label",
            `${choice} expedition. Reward chance ${chancePercent}%. ` +
            `Random roll ${result.roll}. Team was ${outcome}. ` +
            "Scale marks 0%, 15%, 60%, and 100%."
        );
    }else{
        rollValue.textContent = "—";
        if(result)
            hideRewardNeedle();
        else
            setRewardNeedlePosition(0);
        dial.setAttribute(
            "aria-label",
            result
                ? `${choice} expedition. Reward chance ${chancePercent}%. ` +
                  `Random roll was not saved; result ${result.delta} points. ` +
                  "Scale marks 0%, 15%, 60%, and 100%."
                : `${choice} expedition. Reward chance ${chancePercent}%. ` +
                  "Random roll pending. Scale marks 0%, 15%, 60%, and 100%."
        );
    }
}

function resetRewardDialForVoting(){

    const dial = document.getElementById("rewardDial");
    const rollValue =
        document.getElementById("rewardRollValue");

    dial.classList.remove("has-choice");
    dial.style.setProperty("--reward-success-angle", "0deg");
    rollValue.removeAttribute("data-outcome");
    rollValue.textContent = "0%";
    setRewardNeedlePosition(0);
    dial.setAttribute(
        "aria-label",
        "Voting is open. Random roll resets to 0%. " +
        "Scale marks 0%, 15%, 60%, and 100%."
    );
}

function updateRewardDial(){

    if(votingOpen && !votedChoice){
        resetRewardDialForVoting();
        return;
    }

    const resultForCurrentRound =
        latestTeamResult &&
        currentRound !== null &&
        latestTeamResult.round === currentRound;
    const result =
        resultForCurrentRound || !votedChoice
            ? latestTeamResult
            : null;
    const choice =
        result?.choice ??
        votedChoice ??
        latestTeamResult?.choice ??
        null;

    renderRewardDial(choice, result);
}

function handleTeamRemoved(){

    const removedGameCode = gameCode;
    const removedTeamName =
        document.getElementById("teamTitle").textContent;

    localStorage.removeItem("survivorTeamId");
    localStorage.removeItem("survivorGameCode");
    stopCurrentGameListeners();

    teamId = null;
    gameCode = null;
    document.getElementById("activeGameCode").textContent = "";

    document
    .getElementById("gameCard")
    .classList
    .add("hidden");

    gameCodeInput.value = removedGameCode ?? "";
    teamNameInput.value = removedTeamName;
    joinStatus.textContent =
        "This team is no longer in the game. Join again to continue.";
    joinStatus.classList.remove("hidden");

    if(!joinDialog.open)
        joinDialog.showModal();
}

function listenForRoundResults(){

    const listeningGameCode = gameCode;
    const listeningTeamId = teamId;
    const resultsQuery =
    query(
        collection(
            db,
            "games",
            listeningGameCode,
            "results"
        ),
        where("teamId", "==", listeningTeamId)
    );

    unsubscribeResults =
    onSnapshot(

        resultsQuery,

        snap=>{

            if(gameCode !== listeningGameCode ||
               teamId !== listeningTeamId)
                return;

            const results =
            snap.docs
                .map(resultDoc=>resultDoc.data())
                .sort((a, b)=>
                    b.round - a.round ||
                    a.teamName.localeCompare(b.teamName)
                );

            const resultsContainer =
            document.getElementById("roundResults");

            resultsContainer.replaceChildren();
            latestTeamResult = results[0] ?? null;
            renderScoreChange(null);
            updateRewardDial();
            maybeShowPendingConfetti();

            if(results.length === 0){
                resultsContainer.textContent =
                    "No round results logged yet.";
                return;
            }

            results.forEach(result=>{

                const row =
                document.createElement("div");

                row.className = "round-result";
                row.textContent =
                    `Round ${result.round} — ${result.teamName} chose ${result.choice}: ` +
                    `${result.delta > 0 ? "+" : ""}${result.delta} points ` +
                    `(score: ${result.score})`;

                resultsContainer.append(row);
            });
        },
        error=>{
            if(gameCode === listeningGameCode &&
               teamId === listeningTeamId){
                const rewardDial =
                    document.getElementById("rewardDial");
                const rewardRollValue =
                    document.getElementById("rewardRollValue");

                rewardRollValue.textContent = "—";
                rewardRollValue.dataset.outcome = "error";
                rewardDial.setAttribute(
                    "aria-label",
                    `Unable to load reward result: ${error.message}`
                );
            }
        }

    );
}

function listenForVoting(){

    unsubscribeGame =
    onSnapshot(

        doc(
            db,
            "games",
            gameCode
        ),

        snap=>{

            if(!snap.exists())
                return;

            const game = snap.data();
            const roundChanged = currentRound !== game.round;

            currentRound = game.round;
            votingOpen = game.votingOpen === true;

            if(roundChanged){

                unsubscribeVote?.();
                unsubscribeLegacyVote?.();
                voteLoaded = false;
                votedChoice = null;
                updateRewardDial();

                const listeningGameCode = gameCode;
                const voteRoundIds = getVoteRoundIds(currentRound);
                const voteSnapshots = new Map();
                const unsubscribeVotes =
                    voteRoundIds.map(roundId=>
                        onSnapshot(
                            doc(
                                db,
                                "games",
                                listeningGameCode,
                                "votes",
                                roundId,
                                "teams",
                                teamId
                            ),
                            voteSnap=>{

                                if(gameCode !== listeningGameCode ||
                                   currentRound !== game.round)
                                    return;

                                voteSnapshots.set(
                                    roundId,
                                    voteSnap.exists()
                                        ? voteSnap.data()
                                        : null
                                );
                                if(voteSnapshots.size !== voteRoundIds.length)
                                    return;

                                const existingVotes =
                                    voteRoundIds
                                        .map(id=>voteSnapshots.get(id))
                                        .filter(Boolean)
                                        .sort((a, b)=>
                                            (b.timestamp ?? 0) -
                                            (a.timestamp ?? 0)
                                        );

                                voteLoaded = true;
                                votedChoice =
                                    existingVotes[0]?.choice ?? null;
                                updateVoteButtons();
                                updateVoteStatus();
                                updateRewardDial();
                            },
                            error=>{
                                if(gameCode === listeningGameCode &&
                                   currentRound === game.round)
                                    showVoteStatus(
                                        `Unable to load vote: ${error.message}`
                                    );
                            }
                        )
                    );

                unsubscribeVote = unsubscribeVotes[0] ?? null;
                unsubscribeLegacyVote = unsubscribeVotes[1] ?? null;
            }

            updateVoteButtons();
            updateVoteStatus();
            updateRewardDial();
        }

    );
}

function updateVoteButtons(){

    openJoinDialogButton.disabled = submittingVote;

    voteButtons.forEach(button=>{

        const hasVoted =
            votedChoice === button.dataset.choice;

        button.disabled =
            !votingOpen ||
            !voteLoaded ||
            submittingVote;

        button.querySelector(".vote-indicator")
            .classList.toggle("hidden", !hasVoted);
    });
}

function stopCurrentGameListeners(){

    unsubscribeScore?.();
    unsubscribeGame?.();
    unsubscribeVote?.();
    unsubscribeLegacyVote?.();
    unsubscribeResults?.();

    unsubscribeScore = null;
    unsubscribeGame = null;
    unsubscribeVote = null;
    unsubscribeLegacyVote = null;
    unsubscribeResults = null;
    currentRound = null;
    votingOpen = false;
    voteLoaded = false;
    votedChoice = null;
    latestTeamResult = null;
    currentTeamScore = null;
    pendingScoreIncreaseConfetti = false;
    confettiFallbackReady = false;
    renderScoreChange(null);

    if(confettiFallbackTimer !== null){
        window.clearTimeout(confettiFallbackTimer);
        confettiFallbackTimer = null;
    }

    if(rewardNeedleAnimationTimer !== null){
        window.clearTimeout(rewardNeedleAnimationTimer);
        rewardNeedleAnimationTimer = null;
    }

    rewardNeedleAnimating = false;
    updateRewardDial();
}

function updateVoteStatus(){

    if(!voteLoaded){
        showVoteStatus("Checking voting status...");
    }else if(!votingOpen){
        showVoteStatus(
            votedChoice
                ? `Voting is closed. Final vote: ${votedChoice}.`
                : "Voting is closed."
        );
    }else if(votedChoice){
        showVoteStatus(
            `Current vote: ${votedChoice}. You can change it until voting closes.`
        );
    }else{
        showVoteStatus("");
    }
}

function showVoteStatus(message){

    document
        .getElementById("voteStatus")
        .textContent = message;
}

voteButtons.forEach(button=>{

    button.addEventListener(
        "click",
        submitVote
    );
});

async function submitVote(event){

    if(submittingVote || !votingOpen || !voteLoaded)
        return;

    const choice = event.currentTarget.dataset.choice;
    const votingGameCode = gameCode;
    const votingTeamId = teamId;
    submittingVote = true;
    updateVoteButtons();
    showVoteStatus("Submitting vote...");

    try{
        const voteResult =
        await runTransaction(
            db,
            async transaction=>{

                const gameRef =
                doc(
                    db,
                    "games",
                    votingGameCode
                );

                const gameSnap =
                await transaction.get(gameRef);

                if(!gameSnap.exists() || gameSnap.data().votingOpen !== true)
                    return { status:"closed" };

                const game = gameSnap.data();
                const teamRef =
                doc(
                    db,
                    "games",
                    votingGameCode,
                    "teams",
                    votingTeamId
                );

                const teamSnap =
                await transaction.get(teamRef);

                if(!teamSnap.exists())
                    return { status:"removed" };

                const round = game.round;
                const voteRoundIds = getVoteRoundIds(round);
                const voteRoundRef =
                doc(
                    db,
                    "games",
                    votingGameCode,
                    "votes",
                    voteRoundIds[0]
                );
                const voteRefs =
                    voteRoundIds.map(roundId=>
                        doc(
                            db,
                            "games",
                            votingGameCode,
                            "votes",
                            roundId,
                            "teams",
                            votingTeamId
                        )
                    );
                const existingVotes =
                    await Promise.all(
                        voteRefs.map(voteRef=>
                            transaction.get(voteRef)
                        )
                    );

                transaction.set(
                    voteRoundRef,
                    { round },
                    { merge:true }
                );

                transaction.set(
                    voteRefs[0],
                    {
                        teamId:votingTeamId,
                        teamName:teamSnap.data().name,
                        choice,
                        round,
                        timestamp:Date.now()
                    }
                );

                return {
                    status:existingVotes.some(voteSnap=>voteSnap.exists())
                        ? "updated"
                        : "submitted",
                    round
                };
            }
        );

        if(voteResult.status === "closed"){
            votingOpen = false;
            updateVoteButtons();
            updateVoteStatus();
            return;
        }

        if(voteResult.status === "removed"){
            handleTeamRemoved();
            return;
        }

        if(votingGameCode === gameCode && voteResult.round === currentRound){
            votedChoice = choice;
            voteLoaded = true;
            updateRewardDial();
        }

        showVoteStatus(
            voteResult.status === "updated"
                ? `Vote updated: ${choice}`
                : `Vote submitted: ${choice}`
        );
    }catch(error){
        showVoteStatus(`Unable to update vote: ${error.message}`);
    }finally{
        submittingVote = false;
        updateVoteButtons();
    }
}

</script>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Statistics Survivor</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    color:#002E5D;
}

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:20px;
}

.page-header h1{
    margin:0;
}

.active-game-code{
    display:inline-block;
    margin-left:.5em;
    color:#555;
    font-size:.75em;
    font-weight:normal;
    overflow-wrap:anywhere;
}

.gear-button{
    display:grid;
    flex:0 0 48px;
    width:48px;
    height:48px;
    place-items:center;
    padding:0;
    margin:0;
    background:#002E5D;
    color:white;
    font-size:26px;
    line-height:1;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

dialog{
    box-sizing:border-box;
    width:min(520px,calc(100% - 32px));
    padding:24px;
    border:0;
    border-radius:10px;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

dialog::backdrop{
    background:rgba(0,0,0,.55);
}

.dialog-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.dialog-header h2{
    margin:0;
}

.dialog-close-button{
    width:40px;
    height:40px;
    padding:0;
    margin:0;
    border:1px solid #777;
    border-radius:2px;
    background:#f0f0f0;
    color:#111;
    font-size:24px;
}

.dialog-close-button:hover{
    background:#e5e5e5;
}

.join-button{
    border:0;
    border-radius:5px;
    background:#00B140;
    color:white;
}

.join-button:hover{
    background:#009d39;
}

input{
    box-sizing:border-box;
    width:100%;
    max-width:100%;
    padding:10px;
    margin:8px 0;
    font-size:16px;
}

button{
    border:0;
    border-radius:5px;
    padding:12px 20px;
    margin:5px;
    cursor:pointer;
    font-size:16px;
}

button:disabled{
    cursor:not-allowed;
    opacity:.6;
}

button:focus-visible{
    outline:3px solid #00B140;
    outline-offset:2px;
}

.current-score{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    max-width:320px;
    padding:16px 20px;
    border-radius:8px;
    background:#002E5D;
    color:white;
    font-weight:bold;
}

.current-score span{
    font-size:1.8rem;
}

.vote{
    display:block;
    position:relative;
    width:100%;
    min-height:76px;
    padding:16px 60px 16px 20px;
    border-radius:8px;
    background:#00B140;
    color:white;
    text-align:left;
}

.vote:not(:disabled):hover{
    background:#009d39;
}

.vote:disabled{
    cursor:not-allowed;
    opacity:.6;
}

.vote-indicator{
    position:absolute;
    top:50%;
    right:16px;
    transform:translateY(-50%);
    color:white;
    font-size:2.5rem;
    line-height:1;
    font-weight:bold;
}

.hidden{
    display:none;
}

.success{
    color:green;
    font-weight:bold;
}

.round-result{
    margin-bottom:10px;
    padding:12px;
    border-radius:6px;
    background:#f2f2f2;
}

@media(max-width:600px){
    body{
        padding:14px;
    }

    .card{
        padding:16px;
    }

    .page-header{
        align-items:flex-start;
    }

    .page-header h1{
        font-size:1.6rem;
    }

    .current-score{
        max-width:none;
    }
}

</style>

</head>

<body>

<header class="page-header">
    <h1>Statistics Survivor<span id="activeGameCode"
                                 class="active-game-code"></span></h1>
    <button id="openJoinDialogBtn"
            class="gear-button"
            type="button"
            aria-label="Join a game"
            aria-haspopup="dialog"
            aria-controls="joinDialog"
            title="Join a game">⚙</button>
</header>

<dialog id="joinDialog"
        aria-labelledby="joinDialogTitle">

    <div class="dialog-header">
        <h2 id="joinDialogTitle">Join Game</h2>
        <button id="closeJoinDialogBtn"
                class="dialog-close-button"
                type="button"
                aria-label="Close dialog"
                title="Close dialog">×</button>
    </div>

    <label for="gameCode">Game Code</label>

    <input id="gameCode"
           value="testgame">

    <label for="teamName">Team Name</label>

    <input id="teamName"
           maxlength="80">

    <p id="joinStatus"
       class="hidden"
       role="status"></p>

    <button id="joinBtn"
            class="join-button"
            type="button">
        Join Game
    </button>

</dialog>

<div id="gameCard"
     class="card hidden">

    <h2 id="teamTitle"></h2>

    <p class="current-score">
        Current Score:
        <span id="score">100</span>
    </p>

    <h3>Choose Expedition</h3>

    <button class="vote"
            data-choice="Safe">

        SAFE EXPEDITION<br>
        Guaranteed +8
        <span class="vote-indicator hidden"
              role="img"
              aria-label="Vote submitted">✓</span>
    </button>

    <button class="vote"
            data-choice="Explorer">

        EXPLORER EXPEDITION<br>
        60% +18, 40% -8
        <span class="vote-indicator hidden"
              role="img"
              aria-label="Vote submitted">✓</span>
    </button>

    <button class="vote"
            data-choice="Treasure">

        TREASURE EXPEDITION<br>
        15% +60, 85% -12
        <span class="vote-indicator hidden"
              role="img"
              aria-label="Vote submitted">✓</span>
    </button>

    <p id="voteStatus"></p>

    <h3>Logged Round Results</h3>

    <div id="roundResults">
        No round results logged yet.
    </div>

</div>

<script type="module">

import { db }
from "./firebase.js";

import {
    collection,
    doc,
    updateDoc,
    getDoc,
    getDocs,
    onSnapshot,
    query,
    runTransaction,
    where
}
from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

let teamId = null;
let gameCode = null;
let currentRound = null;
let votingOpen = false;
let voteLoaded = false;
let votedChoice = null;
let submittingVote = false;
let unsubscribeScore = null;
let unsubscribeGame = null;
let unsubscribeVote = null;
let unsubscribeLegacyVote = null;
let unsubscribeResults = null;

const voteButtons =
document.querySelectorAll(".vote");
const joinDialog =
document.getElementById("joinDialog");
const openJoinDialogButton =
document.getElementById("openJoinDialogBtn");
const gameCodeInput =
document.getElementById("gameCode");
const teamNameInput =
document.getElementById("teamName");
const joinStatus =
document.getElementById("joinStatus");

function getVoteRoundIds(round){

    const paddedRoundId =
        `round${String(round).padStart(2, "0")}`;
    const legacyRoundId = `round${round}`;

    return paddedRoundId === legacyRoundId
        ? [paddedRoundId]
        : [paddedRoundId, legacyRoundId];
}

const savedTeam =
localStorage.getItem("survivorTeamId");

const savedGame =
localStorage.getItem("survivorGameCode");

if(savedTeam && savedGame){

    teamId = savedTeam;
    gameCode = savedGame;

    loadExistingTeam();
}

document
.getElementById("joinBtn")
.addEventListener(
"click",
joinGame
);

document
.getElementById("openJoinDialogBtn")
.addEventListener("click", openJoinDialog);

document
.getElementById("closeJoinDialogBtn")
.addEventListener("click", ()=>joinDialog.close());

async function joinGame(){

    const requestedGameCode =
        gameCodeInput.value.trim();

    if(!requestedGameCode || requestedGameCode.includes("/")){

        alert(
        "Enter a valid game code"
        );

        return;
    }

    const teamName =
        teamNameInput.value.trim();

    if(!teamName){

        alert(
        "Enter a team name"
        );

        return;
    }

    const gameSnap =
    await getDoc(
        doc(
            db,
            "games",
            requestedGameCode
        )
    );

    if(!gameSnap.exists()){

        alert(
        "Game not found. Check the game code."
        );

        return;
    }

    const normalizedName =
        teamName.normalize("NFKC").toLowerCase();
    const encodedName =
        encodeURIComponent(normalizedName);

    if(encodedName.length > 1400){
        alert("That team name is too long.");
        return;
    }

    const teamsCollection =
    collection(
        db,
        "games",
        requestedGameCode,
        "teams"
    );

    const existingTeams =
    await getDocs(teamsCollection);

    const nameAlreadyTaken =
    existingTeams.docs.some(teamDoc=>
        (teamDoc.data().normalizedName ??
            teamDoc.data().name?.trim().normalize("NFKC").toLowerCase()) ===
        normalizedName
    );

    if(nameAlreadyTaken){
        alert("That team name is already taken in this game. Choose another name.");
        return;
    }

    const teamRef = doc(teamsCollection);
    const teamNameRef =
    doc(
        db,
        "games",
        requestedGameCode,
        "teamNames",
        encodedName
    );

    let teamCreated;

    try{
        teamCreated =
        await runTransaction(
            db,
            async transaction=>{

                const nameSnap =
                await transaction.get(teamNameRef);

                if(nameSnap.exists())
                    return false;

                transaction.set(
                    teamNameRef,
                    {
                        teamId:teamRef.id,
                        name:teamName
                    }
                );

                transaction.set(
                    teamRef,
                    {
                        name:teamName,
                        normalizedName,
                        score:100
                    }
                );

                return true;
            }
        );
    }catch(error){
        alert(`Unable to join game: ${error.message}`);
        return;
    }

    if(!teamCreated){
        alert("That team name is already taken in this game. Choose another name.");
        return;
    }

    stopCurrentGameListeners();
    teamId =
    teamRef.id;
    gameCode =
    requestedGameCode;

    localStorage.setItem(
        "survivorTeamId",
        teamId
    );

    localStorage.setItem(
        "survivorGameCode",
        gameCode
    );

    showGame(teamName);

    listenForScore();
    listenForVoting();
    listenForRoundResults();
    joinStatus.textContent = "";
    joinStatus.classList.add("hidden");
    joinDialog.close();
}

async function loadExistingTeam(){

    const teamRef =
    doc(
        db,
        "games",
        gameCode,
        "teams",
        teamId
    );

    const snap =
    await getDoc(
        teamRef
    );

    if(!snap.exists()){

        handleTeamRemoved();
        return;
    }

    showGame(
        snap.data().name
    );

    listenForScore();
    listenForVoting();
    listenForRoundResults();
}

function showGame(name){

    document.getElementById("activeGameCode").textContent =
        gameCode ? `· Game: ${gameCode}` : "";

    document
    .getElementById("gameCard")
    .classList
    .remove("hidden");

    document
    .getElementById("teamTitle")
    .innerText =
    name;
}

function openJoinDialog(){

    joinStatus.textContent = "";
    joinStatus.classList.add("hidden");

    if(teamId){
        gameCodeInput.value = gameCode;
        teamNameInput.value =
            document.getElementById("teamTitle").textContent;
    }

    joinDialog.showModal();
    gameCodeInput.focus();
}

function listenForScore(){

    unsubscribeScore =
    onSnapshot(

        doc(
            db,
            "games",
            gameCode,
            "teams",
            teamId
        ),

        snap=>{

            if(!snap.exists()){
                handleTeamRemoved();
                return;
            }

            document
            .getElementById(
                "score"
            )
            .innerText =
            snap.data().score;

        }

    );
}

function handleTeamRemoved(){

    const removedGameCode = gameCode;
    const removedTeamName =
        document.getElementById("teamTitle").textContent;

    localStorage.removeItem("survivorTeamId");
    localStorage.removeItem("survivorGameCode");
    stopCurrentGameListeners();

    teamId = null;
    gameCode = null;
    document.getElementById("activeGameCode").textContent = "";

    document
    .getElementById("gameCard")
    .classList
    .add("hidden");

    gameCodeInput.value = removedGameCode ?? "";
    teamNameInput.value = removedTeamName;
    joinStatus.textContent =
        "This team is no longer in the game. Join again to continue.";
    joinStatus.classList.remove("hidden");

    if(!joinDialog.open)
        joinDialog.showModal();
}

function listenForRoundResults(){

    const resultsQuery =
    query(
        collection(
            db,
            "games",
            gameCode,
            "results"
        ),
        where("teamId", "==", teamId)
    );

    unsubscribeResults =
    onSnapshot(

        resultsQuery,

        snap=>{

            const results =
            snap.docs
                .map(resultDoc=>resultDoc.data())
                .sort((a, b)=>
                    b.round - a.round ||
                    a.teamName.localeCompare(b.teamName)
                );

            const resultsContainer =
            document.getElementById("roundResults");

            resultsContainer.replaceChildren();

            if(results.length === 0){
                resultsContainer.textContent =
                    "No round results logged yet.";
                return;
            }

            results.forEach(result=>{

                const row =
                document.createElement("div");

                row.className = "round-result";
                row.textContent =
                    `Round ${result.round} — ${result.teamName} chose ${result.choice}: ` +
                    `${result.delta > 0 ? "+" : ""}${result.delta} points ` +
                    `(score: ${result.score})`;

                resultsContainer.append(row);
            });
        }

    );
}

function listenForVoting(){

    unsubscribeGame =
    onSnapshot(

        doc(
            db,
            "games",
            gameCode
        ),

        snap=>{

            if(!snap.exists())
                return;

            const game = snap.data();
            const roundChanged = currentRound !== game.round;

            currentRound = game.round;
            votingOpen = game.votingOpen === true;

            if(roundChanged){

                unsubscribeVote?.();
                unsubscribeLegacyVote?.();
                voteLoaded = false;
                votedChoice = null;

                const listeningGameCode = gameCode;
                const voteRoundIds = getVoteRoundIds(currentRound);
                const voteSnapshots = new Map();
                const unsubscribeVotes =
                    voteRoundIds.map(roundId=>
                        onSnapshot(
                            doc(
                                db,
                                "games",
                                listeningGameCode,
                                "votes",
                                roundId,
                                "teams",
                                teamId
                            ),
                            voteSnap=>{

                                if(gameCode !== listeningGameCode ||
                                   currentRound !== game.round)
                                    return;

                                voteSnapshots.set(
                                    roundId,
                                    voteSnap.exists()
                                        ? voteSnap.data()
                                        : null
                                );
                                if(voteSnapshots.size !== voteRoundIds.length)
                                    return;

                                const existingVotes =
                                    voteRoundIds
                                        .map(id=>voteSnapshots.get(id))
                                        .filter(Boolean)
                                        .sort((a, b)=>
                                            (b.timestamp ?? 0) -
                                            (a.timestamp ?? 0)
                                        );

                                voteLoaded = true;
                                votedChoice =
                                    existingVotes[0]?.choice ?? null;
                                updateVoteButtons();
                                updateVoteStatus();
                            },
                            error=>{
                                if(gameCode === listeningGameCode &&
                                   currentRound === game.round)
                                    showVoteStatus(
                                        `Unable to load vote: ${error.message}`
                                    );
                            }
                        )
                    );

                unsubscribeVote = unsubscribeVotes[0] ?? null;
                unsubscribeLegacyVote = unsubscribeVotes[1] ?? null;
            }

            updateVoteButtons();
            updateVoteStatus();
        }

    );
}

function updateVoteButtons(){

    openJoinDialogButton.disabled = submittingVote;

    voteButtons.forEach(button=>{

        const hasVoted =
            votedChoice === button.dataset.choice;

        button.disabled =
            !votingOpen ||
            !voteLoaded ||
            submittingVote;

        button.querySelector(".vote-indicator")
            .classList.toggle("hidden", !hasVoted);
    });
}

function stopCurrentGameListeners(){

    unsubscribeScore?.();
    unsubscribeGame?.();
    unsubscribeVote?.();
    unsubscribeLegacyVote?.();
    unsubscribeResults?.();

    unsubscribeScore = null;
    unsubscribeGame = null;
    unsubscribeVote = null;
    unsubscribeLegacyVote = null;
    unsubscribeResults = null;
    currentRound = null;
    votingOpen = false;
    voteLoaded = false;
    votedChoice = null;
}

function updateVoteStatus(){

    if(!voteLoaded){
        showVoteStatus("Checking voting status...");
    }else if(!votingOpen){
        showVoteStatus(
            votedChoice
                ? `Voting is closed. Final vote: ${votedChoice}.`
                : "Voting is closed."
        );
    }else if(votedChoice){
        showVoteStatus(
            `Current vote: ${votedChoice}. You can change it until voting closes.`
        );
    }else{
        showVoteStatus("");
    }
}

function showVoteStatus(message){

    document
        .getElementById("voteStatus")
        .textContent = message;
}

voteButtons.forEach(button=>{

    button.addEventListener(
        "click",
        submitVote
    );
});

async function submitVote(event){

    if(submittingVote || !votingOpen || !voteLoaded)
        return;

    const choice = event.currentTarget.dataset.choice;
    const votingGameCode = gameCode;
    const votingTeamId = teamId;
    submittingVote = true;
    updateVoteButtons();
    showVoteStatus("Submitting vote...");

    try{
        const voteResult =
        await runTransaction(
            db,
            async transaction=>{

                const gameRef =
                doc(
                    db,
                    "games",
                    votingGameCode
                );

                const gameSnap =
                await transaction.get(gameRef);

                if(!gameSnap.exists() || gameSnap.data().votingOpen !== true)
                    return { status:"closed" };

                const game = gameSnap.data();
                const teamRef =
                doc(
                    db,
                    "games",
                    votingGameCode,
                    "teams",
                    votingTeamId
                );

                const teamSnap =
                await transaction.get(teamRef);

                if(!teamSnap.exists())
                    return { status:"removed" };

                const round = game.round;
                const voteRoundIds = getVoteRoundIds(round);
                const voteRoundRef =
                doc(
                    db,
                    "games",
                    votingGameCode,
                    "votes",
                    voteRoundIds[0]
                );
                const voteRefs =
                    voteRoundIds.map(roundId=>
                        doc(
                            db,
                            "games",
                            votingGameCode,
                            "votes",
                            roundId,
                            "teams",
                            votingTeamId
                        )
                    );
                const existingVotes =
                    await Promise.all(
                        voteRefs.map(voteRef=>
                            transaction.get(voteRef)
                        )
                    );

                transaction.set(
                    voteRoundRef,
                    { round },
                    { merge:true }
                );

                transaction.set(
                    voteRefs[0],
                    {
                        teamId:votingTeamId,
                        teamName:teamSnap.data().name,
                        choice,
                        round,
                        timestamp:Date.now()
                    }
                );

                return {
                    status:existingVotes.some(voteSnap=>voteSnap.exists())
                        ? "updated"
                        : "submitted",
                    round
                };
            }
        );

        if(voteResult.status === "closed"){
            votingOpen = false;
            updateVoteButtons();
            updateVoteStatus();
            return;
        }

        if(voteResult.status === "removed"){
            handleTeamRemoved();
            return;
        }

        if(votingGameCode === gameCode && voteResult.round === currentRound){
            votedChoice = choice;
            voteLoaded = true;
        }

        showVoteStatus(
            voteResult.status === "updated"
                ? `Vote updated: ${choice}`
                : `Vote submitted: ${choice}`
        );
    }catch(error){
        showVoteStatus(`Unable to update vote: ${error.message}`);
    }finally{
        submittingVote = false;
        updateVoteButtons();
    }
}

</script>

</body>

</html>
